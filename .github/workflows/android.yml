name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, sign, and publish developer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Verify persistent signing configuration
        env:
          ESPECTRAL_DEV_KEYSTORE_B64: ${{ secrets.ESPECTRAL_DEV_KEYSTORE_B64 }}
          ESPECTRAL_DEV_STORE_PASSWORD: ${{ secrets.ESPECTRAL_DEV_STORE_PASSWORD }}
          ESPECTRAL_DEV_KEY_PASSWORD: ${{ secrets.ESPECTRAL_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ESPECTRAL_DEV_KEYSTORE_B64" || { echo "::error::ESPECTRAL_DEV_KEYSTORE_B64 is not configured."; exit 1; }
          test -n "$ESPECTRAL_DEV_STORE_PASSWORD" || { echo "::error::ESPECTRAL_DEV_STORE_PASSWORD is not configured."; exit 1; }
          test -n "$ESPECTRAL_DEV_KEY_PASSWORD" || { echo "::error::ESPECTRAL_DEV_KEY_PASSWORD is not configured."; exit 1; }
          mkdir -p .ci
          printf '%s' "$ESPECTRAL_DEV_KEYSTORE_B64" | base64 --decode > .ci/espectral-dev.jks
          test -s .ci/espectral-dev.jks

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed developer APK
        env:
          ESPECTRAL_DEV_STORE_PASSWORD: ${{ secrets.ESPECTRAL_DEV_STORE_PASSWORD }}
          ESPECTRAL_DEV_KEY_PASSWORD: ${{ secrets.ESPECTRAL_DEV_KEY_PASSWORD }}
          ESPECTRAL_DEV_KEY_ALIAS: ${{ secrets.ESPECTRAL_DEV_KEY_ALIAS || 'espectral-dev' }}
        run: |
          ./gradlew assembleDebug \
            -PdevVersionCode=${{ github.run_number }} \
            -PdevVersionName="1.0.${{ github.run_number }}"

      - name: Verify APK identity and version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"

      - name: Upload signed developer APK
        uses: actions/upload-artifact@v4
        with:
          name: espectral-hunt-developer-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload rolling developer APK
        uses: actions/upload-artifact@v4
        with:
          name: espectral-hunt-developer-latest
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
